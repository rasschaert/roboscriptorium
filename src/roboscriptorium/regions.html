<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review regions</title>
<style>
:root {
  --bg: #f6f5f1; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dddbd3;
  --ok: #1f6f43; --ok-bg: #e3f2e8; --warn: #9a3412; --warn-bg: #fcebdc;
  --accent: #2f5bd3; --accent-bg: #e6ecfb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --card: #22221f; --ink: #ecebe6; --muted: #9b9a94; --line: #3a3a35;
    --ok: #7dd3a0; --ok-bg: #183326; --warn: #fdba74; --warn-bg: #3b2414;
    --accent: #8aa8ff; --accent-bg: #1d2640;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
.progress { flex: 1; min-width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--ok); }
.counts { color: var(--muted); font-variant-numeric: tabular-nums; }
label.toggle { color: var(--muted); user-select: none; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
.readings { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; color: var(--muted); font-size: 13px; }
.question { margin: 14px 0 6px; font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
.choice { display: flex; align-items: baseline; gap: 10px; text-align: left; width: 100%; padding: 10px 12px; }
.choice .reading { flex: 1; font: 18px/1.45 Georgia, "Iowan Old Style", serif; }
.choice .votes { font-size: 12px; color: var(--muted); white-space: nowrap; }
.choice .muted { color: var(--muted); font-style: italic; }
mark { background: var(--warn-bg); color: var(--warn); border-radius: 3px; padding: 0 1px; }
mark.gap { display: inline-block; width: 3px; height: 1em; vertical-align: -0.1em; background: var(--warn); }
.secondary { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
.secondary button { padding: 3px 8px; font-size: 13px; }
.readings .votes { display: block; font: 11px -apple-system, sans-serif; color: var(--muted); }
.readings button { font: 16px/1.4 Georgia, "Iowan Old Style", serif; text-align: left; white-space: pre-wrap; }
.turnbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.turnbar button { padding: 4px 10px; }
.crop { max-width: 100%; max-height: 75vh; margin: 0 auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; min-height: 60px; }
.why { margin: 12px 0 4px; color: var(--muted); font-size: 13px; }
.why span { display: inline-block; background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 6px; margin: 0 4px 4px 0; }
.now { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.now b { color: var(--ink); }
.context { font-family: Georgia, "Iowan Old Style", serif; font-size: 15px; color: var(--muted); white-space: pre-wrap; }
textarea { width: 100%; font: 18px/1.45 Georgia, "Iowan Old Style", serif; padding: 8px 10px; margin: 4px 0;
  border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; }
textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.current { background: var(--accent-bg); border-color: var(--accent); }
.initial-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 4px; font-size: 16px; }
.initial-row input { font: 24px Georgia, serif; width: 2.2em; text-align: center; padding: 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
button.answered { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
button:disabled { opacity: .5; cursor: progress; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin-right: 6px; color: var(--muted); }
.answer { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--ok-bg); color: var(--ok); }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
.nav { display: flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 13px; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Regions to check</h1>
  <div class="progress"><div id="bar"></div></div>
  <span class="counts" id="counts"></span>
  <button id="rebuild" title="Rebuild the EPUB with your answers">Rebuild book</button>
</header>
<main id="main"></main>
<script>
let state = null, queue = [], pos = 0, out = 0;
const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const KEYS = {"1": "text", "2": "heading", "3": "drop", "4": "image", "5": "caption"};
const CURRENT = {text: "text", heading: "heading", dropped: "drop", missing: "drop"};
const NOW = {text: "kept as running text", heading: "made a heading", dropped: "left out of the book",
  missing: "has nothing here"};

async function load() {
  state = await (await fetch("/api/state")).json();
  queue = state.items;
  pos = Math.max(0, queue.findIndex(r => !r.answer));
  render();
}

// After a rebuild the regions are new objects; stay on the same region where it still exists.
function rebuild(keepKey) {
  queue = state.items;
  const i = keepKey ? queue.findIndex(r => r.key === keepKey) : -1;
  pos = i >= 0 ? i : Math.min(pos, Math.max(0, queue.length - 1));
  out = 0;
  render();
}

function nextUnanswered(from) {
  const i = queue.findIndex((r, k) => k > from && !r.answer);
  return i >= 0 ? i : Math.min(from + 1, queue.length - 1);
}

const picture = r => r.box && r.reasons.some(x => x.startsWith("a picture"));
// The text box, which a picture region doesn't have.
const textBox = () => document.getElementById("text");

function counts() {
  const answered = state.items.filter(r => r.answer).length;
  document.getElementById("bar").style.width = (100 * answered / Math.max(1, state.items.length)) + "%";
  const applied = state.applied == null ? "" : ` · ${state.applied} applied in the last build`;
  document.getElementById("counts").textContent = `${answered} / ${state.items.length} answered${applied}`;
}

function render() {
  counts();
  if (!queue.length) {
    main.innerHTML = `<div class="card">Nothing flagged in this book.</div>`;
    return;
  }
  const r = queue[pos];
  const a = r.answer;
  const text = a && a.text != null ? a.text : (r.draft || r.text || "");
  const drawing = picture(r);
  const doubt = !drawing && r.readings && r.readings.length > 1;
  // A decorated initial is answered with its letter, on its own line, and only for drawings.
  const buttons = Object.entries(KEYS).filter(([, action]) => !doubt || action !== "text").map(([k, action]) => {
    const cls = a && a.action === action ? "answered" : !a && CURRENT[r.treatment] === action ? "current" : "";
    return `<button data-action="${action}" class="${cls}"><kbd>${k}</kbd>${esc(state.actions[action])}</button>`;
  }).join("");
  main.innerHTML = `
  <div class="card">
    <div class="meta">
      <span>${pos + 1} of ${queue.length}${a ? " · answered" : ""}</span>
      <span>page ${r.page}${r.last >= r.first ? `, line ${r.first + 1}${r.last > r.first ? "–" + (r.last + 1) : ""}` : ""} · <a href="/page?page=${r.page}" target="_blank">full page</a></span>
    </div>
    <img class="crop" id="crop" src="${cropUrl(r)}" alt="Scan crop">
    <div class="turnbar">
      <button id="zoomOut" title="Show more of the page around it"><kbd>-</kbd>Zoom out</button>
      <button id="zoomIn" title="Back towards the region" ${out ? "" : "disabled"}><kbd>+</kbd>Zoom in</button>
      ${r.box ? `<span>·</span>
      <button id="turnLeft" title="Turn a quarter anticlockwise">↺</button>
      <button id="turnRight" title="Turn a quarter clockwise"><kbd>r</kbd>↻</button>
      <span>turned ${r.turn || 0}°</span>
      <button id="reread" title="Read the area again as it is turned now"><kbd>o</kbd>Read again</button>` : ""}
    </div>
    <div class="why">Flagged: ${r.reasons.map(x => `<span>${esc(x)}</span>`).join("")}</div>
    ${drawing ? `<div class="initial-row ${a && a.action === "initial" ? "answered" : ""}">
      <label for="letter">A decorated initial, showing the letter</label>
      <input id="letter" size="2" maxlength="3" value="${a && a.action === "initial" ? esc(a.text || "") : ""}">
      <button data-action="initial" class="${a && a.action === "initial" ? "answered" : ""}">Save as initial <kbd>↵</kbd></button>
    </div>
    <div class="now">Or, if it isn't an initial:</div>`
    : doubt ? doubtBlock(r, a, text)
    : `<div class="now">The pipeline <b>${NOW[r.treatment]}</b>. ${r.text ? "Its reading of the highlighted lines (edit if the scan says otherwise):" : r.draft ? "Tesseract's draft of the highlighted area; correct it, then save as text:" : "Type the text here if it belongs in the book:"}</div>
    ${r.before ? `<div class="context">${esc(r.before)}</div>` : ""}
    <textarea id="text" rows="${Math.min(16, text.split("\n").length + 1)}">${esc(text)}</textarea>
    ${r.after ? `<div class="context">${esc(r.after)}</div>` : ""}`}
    ${doubt ? `<div class="secondary">Not running text? ${buttons}</div>` : `<div class="actions">${buttons}</div>`}
    ${a ? `<div class="answer">Your answer: ${esc(state.actions[a.action])}${a.action === "initial" ? ` “${esc(a.text || "")}”` : a.text != null ? " · with your wording" : ""}. Answer again to change it.</div>` : ""}
    <div class="hint">${doubt ? "Press the letter of the reading that matches the scan; it is saved as running text." : (a ? "Green: your answer." : "Blue: what the pipeline did now.") + (drawing ? "" : " In the text box, <kbd>⌘↵</kbd> saves as running text, <kbd>Esc</kbd> leaves the box.")}</div>
    <div class="nav">
      <span>${pos > 0 ? "<kbd>←</kbd>previous" : "first region"}</span>
      <span>${pos < queue.length - 1 ? "<kbd>→</kbd>next" : "last region"}</span>
    </div>
  </div>`;
  main.querySelectorAll("button[data-action]").forEach(b => b.onclick = () => decide(b.dataset.action));
  main.querySelectorAll("button[data-pick]").forEach(b => b.onclick = () => pick(+b.dataset.pick));
  const other = document.getElementById("other");
  if (other) other.onclick = showTextBox;
  document.getElementById("zoomOut").onclick = () => zoom(1);
  document.getElementById("zoomIn").onclick = () => zoom(-1);
  if (r.box) {
    document.getElementById("turnLeft").onclick = () => turn(-90);
    document.getElementById("turnRight").onclick = () => turn(90);
    document.getElementById("reread").onclick = reread;
  }
  const letter = document.getElementById("letter");
  if (letter && !letter.value) {
    fetch(`/api/initial?key=${encodeURIComponent(r.key)}`).then(x => x.json())
      .then(g => { if (!letter.value) letter.value = g.letter; });
  }
}

// Keys for the readings; e (something else), o (read again) and r (turn) are taken.
const READING_KEYS = "abcdfghj";

// Readings that differ: one row each, the differing part marked, saved with one key.
function doubtBlock(r, a, text) {
  const chosen = a && a.action === "text" ? (a.text != null ? a.text : r.text) : null;
  const typed = chosen != null && !r.readings.some(g => g.text === chosen);
  const rows = r.readings.map((g, k) => {
    const against = r.readings[k === 0 ? 1 : 0].text;
    const who = [k === 0 ? "text layer" : "", ...g.votes].filter(Boolean).join(" · ");
    return `<button class="choice ${chosen === g.text ? "answered" : ""}" data-pick="${k}">
      <kbd>${READING_KEYS[k] || ""}</kbd><span class="reading">${marked(g.text, against)}</span>
      <span class="votes">${esc(who)}</span></button>`;
  }).join("");
  return `<div class="question">Which reading matches the scan?</div>
    ${r.before ? `<div class="context">${esc(r.before)}</div>` : ""}
    <div class="choices">${rows}
      <button class="choice ${typed ? "answered" : ""}" id="other"><kbd>e</kbd>
        <span class="reading muted">Something else…</span></button>
    </div>
    <textarea id="text" rows="2" ${typed ? "" : "hidden"}>${esc(typed ? chosen : text)}</textarea>
    ${r.after ? `<div class="context">${esc(r.after)}</div>` : ""}`;
}

// The text with the part where it differs from `other` marked.
function marked(text, other) {
  let i = 0;
  while (i < text.length && i < other.length && text[i] === other[i]) i++;
  let j = 0;
  while (j < text.length - i && j < other.length - i && text[text.length - 1 - j] === other[other.length - 1 - j]) j++;
  const middle = text.slice(i, text.length - j);
  return esc(text.slice(0, i)) + (middle ? `<mark>${esc(middle)}</mark>` : `<mark class="gap"></mark>`)
    + esc(text.slice(text.length - j));
}

function pick(k) {
  const r = queue[pos];
  if (!r.readings || k < 0 || k >= r.readings.length) return;
  decide("text", r.readings[k].text);
}

function showTextBox() {
  const box = textBox();
  if (!box) return;
  box.hidden = false;
  box.focus();
}

function cropUrl(r) {
  return r.box ? `/crop?page=${r.page}&box=${r.box.join(",")}&turn=${r.turn || 0}&out=${out}`
    : `/crop?page=${r.page}&first=${r.first}&last=${r.last}&out=${out}`;
}

// Zoom-out steps; 4 shows about a whole page. Moving to another region resets it.
const MAX_OUT = 4;
function zoom(by) {
  const next = Math.max(0, Math.min(MAX_OUT, out + by));
  if (next === out) return;
  const text = textBox() && textBox().value;
  out = next;
  render();
  if (textBox()) textBox().value = text;
}

function turn(by) {
  const r = queue[pos];
  if (!r.box) return;
  const text = textBox() && textBox().value;
  r.turn = ((r.turn || 0) + by + 360) % 360;
  render();
  if (textBox()) textBox().value = text;
}

async function reread() {
  const r = queue[pos];
  if (!r.box) return;
  const b = document.getElementById("reread");
  b.disabled = true; b.textContent = "Reading…";
  try {
    const resp = await fetch(`/api/read?key=${encodeURIComponent(r.key)}&turn=${r.turn || 0}`);
    if (!resp.ok) throw new Error(await resp.text());
    const text = (await resp.json()).text;
    r.draft = text;
    if (queue[pos] === r && textBox()) textBox().value = text;
  } catch (e) { alert(e); }
  b.disabled = false; b.innerHTML = "<kbd>o</kbd>Read again";
}

async function decide(action, given) {
  const r = queue[pos];
  const letter = document.getElementById("letter");
  const text = given != null ? given
    : action === "initial" ? (letter ? letter.value : "") : textBox() ? textBox().value : "";
  if (action === "initial" && !text.trim()) { alert("Type the letter the initial shows first."); return; }
  const body = {key: r.key, action, text, turn: r.turn || 0};
  const resp = await fetch("/api/verdict", {method: "POST", body: JSON.stringify(body)});
  if (!resp.ok) { alert(await resp.text()); return; }
  r.answer = await resp.json();
  pos = nextUnanswered(pos);
  out = 0;
  render();
}

document.getElementById("rebuild").onclick = async () => {
  const b = document.getElementById("rebuild");
  b.disabled = true; b.textContent = "Rebuilding…";
  try {
    const resp = await fetch("/api/rebuild", {method: "POST"});
    if (!resp.ok) throw new Error(await resp.text());
    state = await resp.json();
    rebuild();
  } catch (e) { alert(e); }
  b.disabled = false; b.textContent = "Rebuild book";
};

document.addEventListener("keydown", e => {
  if (e.target.id === "letter") {
    if (e.key === "Enter") { e.preventDefault(); decide("initial"); }
    else if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.target.tagName === "TEXTAREA") {
    if (e.key === "Escape") e.target.blur();
    else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); decide("text"); }
    return;
  }
  if (KEYS[e.key]) decide(KEYS[e.key]);
  else if (e.key === "Enter" && document.getElementById("letter")) { e.preventDefault(); decide("initial"); }
  else if (e.key === "e" && textBox()) { e.preventDefault(); showTextBox(); }
  else if (e.key.length === 1 && READING_KEYS.includes(e.key)) pick(READING_KEYS.indexOf(e.key));
  else if (e.key === "r") turn(90);
  else if (e.key === "o") reread();
  else if (e.key === "-") zoom(1);
  else if (e.key === "+" || e.key === "=") zoom(-1);
  else if (e.key === "ArrowRight") { pos = Math.min(pos + 1, queue.length - 1); out = 0; render(); }
  else if (e.key === "ArrowLeft") { pos = Math.max(pos - 1, 0); out = 0; render(); }
});
load();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review regions</title>
<style>
:root {
  --bg: #f6f5f1; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dddbd3;
  --ok: #1f6f43; --ok-bg: #e3f2e8;
  --accent: #2f5bd3; --accent-bg: #e6ecfb;
  --has: #0b6b2e; --has-bg: #c9f0d6; --lacks: #b4161b; --lacks-bg: #fde0e0;
  --swap: #6b21a8; --swap-bg: #ead9fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --card: #22221f; --ink: #ecebe6; --muted: #9b9a94; --line: #3a3a35;
    --ok: #7dd3a0; --ok-bg: #183326;
    --accent: #8aa8ff; --accent-bg: #1d2640;
    --has: #86efac; --has-bg: #12391f; --lacks: #fca5a5; --lacks-bg: #4a1414;
    --swap: #d8b4fe; --swap-bg: #351b52;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
.progress { flex: 1; min-width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--ok); }
.counts { color: var(--muted); font-variant-numeric: tabular-nums; }
label.toggle { color: var(--muted); user-select: none; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
.question { margin: 14px 0 6px; font-weight: 600; }
.options { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 8px; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.option.on { border-color: var(--accent); background: var(--accent-bg); }
.option input { margin: 0; }
.reading-option .reading { flex: 1; font: 18px/1.45 Georgia, "Iowan Old Style", serif; }
.option .votes { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
input.letter { font: 24px Georgia, serif; width: 2.2em; text-align: center; padding: 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.saverow { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 9px 22px; }
button.primary:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
mark { border-radius: 3px; padding: 0 2px; font-weight: 700; }
mark.has { background: var(--has-bg); color: var(--has); border-bottom: 2px solid var(--has); }
mark.swap { background: var(--swap-bg); color: var(--swap); border-bottom: 2px dotted var(--swap); }
mark.lacks { background: var(--lacks-bg); color: var(--lacks); text-decoration: line-through 2px; }
mark.lacks::before { content: "‸"; text-decoration: none; display: inline-block; margin-right: 1px; }
mark .space { opacity: 0.7; font-weight: 400; }
mark sub.dash { font: 600 9px system-ui, sans-serif; opacity: 0.8; margin-left: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.legend mark { font-size: 14px; }
.turnbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.turnbar button { padding: 4px 10px; }
.crop { max-width: 100%; max-height: 75vh; margin: 0 auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; min-height: 60px; }
.why { margin: 12px 0 4px; color: var(--muted); font-size: 13px; }
.why span { display: inline-block; background: var(--line); color: var(--ink); border-radius: 4px; padding: 0 6px; margin: 0 4px 4px 0; }
.now { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.now b { color: var(--ink); }
.context { font-family: Georgia, "Iowan Old Style", serif; font-size: 15px; color: var(--muted); white-space: pre-wrap; }
textarea { width: 100%; font: 18px/1.45 Georgia, "Iowan Old Style", serif; padding: 8px 10px; margin: 4px 0;
  border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; }
textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.pad { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 8px; }
.pad button { font: 17px Georgia, serif; min-width: 2.2em; padding: 3px 8px; }
button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: progress; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; margin-right: 6px; color: var(--muted); }
.answer { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--ok-bg); color: var(--ok); }
.hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
.hint.warn { color: #b3261e; }
.nav { display: flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 13px; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Regions to check</h1>
  <div class="progress"><div id="bar"></div></div>
  <span class="counts" id="counts"></span>
  <button id="rebuild" title="Rebuild the EPUB with your answers">Rebuild book</button>
</header>
<main id="main"></main>
<script>
let state = null, queue = [], pos = 0, out = 0;
// Whether the crop shows its highlights (`h`); remembered across visits where storage works.
let marks = true;
try { marks = localStorage.getItem("marks") !== "off"; } catch (e) {}
const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const KINDS = {"1": "text", "2": "heading", "3": "drop", "4": "image", "5": "caption", "6": "initial"};
const CURRENT = {text: "text", heading: "heading", dropped: "drop", missing: "drop"};
const NOW = {text: "kept as running text", heading: "made a heading", dropped: "left out of the book",
  missing: "has nothing here"};

async function load() {
  state = await (await fetch("/api/state")).json();
  queue = state.items;
  pos = Math.max(0, queue.findIndex(r => !r.answer));
  render();
}

// After a rebuild the regions are new objects; stay on the same region where it still exists.
function rebuild(keepKey) {
  queue = state.items;
  const i = keepKey ? queue.findIndex(r => r.key === keepKey) : -1;
  pos = i >= 0 ? i : Math.min(pos, Math.max(0, queue.length - 1));
  out = 0;
  render();
}

function nextUnanswered(from) {
  const i = queue.findIndex((r, k) => k > from && !r.answer);
  return i >= 0 ? i : Math.min(from + 1, queue.length - 1);
}

const picture = r => r.box && r.reasons.some(x => x.startsWith("a picture"));
// The text box, which a picture region doesn't have.
const textBox = () => document.getElementById("text");

function counts() {
  const answered = state.items.filter(r => r.answer).length;
  document.getElementById("bar").style.width = (100 * answered / Math.max(1, state.items.length)) + "%";
  const applied = state.applied == null ? "" : ` · ${state.applied} applied in the last build`;
  document.getElementById("counts").textContent = `${answered} / ${state.items.length} answered${applied}`;
}

// The answer being put together for the region on screen: what it is, and its text.
let draft = null;

function startDraft(r) {
  const a = r.answer;
  const doubt = r.readings && r.readings.length > 1;
  const chosen = a && a.action !== "initial" ? (a.text != null ? a.text : r.text) : null;
  return {
    key: r.key,
    kind: a ? a.action : picture(r) ? "image" : CURRENT[r.treatment] || "text",
    // For a doubt: the chosen reading's index, -1 for typed text, null for none yet.
    reading: !doubt ? null : chosen == null ? null : r.readings.findIndex(g => g.text === chosen),
    text: a && a.text != null && a.action !== "initial" ? a.text : (r.draft || r.text || ""),
    letter: a && a.action === "initial" ? (a.text || "") : "",
  };
}

// Kinds whose answer carries text.
const WITH_TEXT = new Set(["text", "heading", "caption"]);

function render() {
  counts();
  if (!queue.length) {
    main.innerHTML = `<div class="card">Nothing flagged in this book.</div>`;
    return;
  }
  const r = queue[pos];
  const a = r.answer;
  if (!draft || draft.key !== r.key) draft = startDraft(r);
  const drawing = picture(r);
  const doubt = r.readings && r.readings.length > 1;
  const kinds = Object.entries(KINDS).filter(([, kind]) => kind !== "initial" || drawing);
  const kindRows = kinds.map(([k, kind]) => {
    const note = a && a.action === kind ? "your answer" : !a && CURRENT[r.treatment] === kind && !drawing ? "the pipeline's call" : "";
    return `<label class="option ${draft.kind === kind ? "on" : ""}"><input type="radio" name="kind" value="${kind}" ${draft.kind === kind ? "checked" : ""}>
      <kbd>${k}</kbd><span>${esc(state.actions[kind])}</span>${note ? `<span class="votes">${note}</span>` : ""}</label>`;
  }).join("");
  main.innerHTML = `
  <div class="card">
    <div class="meta">
      <span>${pos + 1} of ${queue.length}${a ? " · answered" : ""}</span>
      <span>page ${r.page}${r.last >= r.first ? `, line ${r.first + 1}${r.last > r.first ? "–" + (r.last + 1) : ""}` : ""} · <a href="/page?page=${r.page}" target="_blank">full page</a></span>
    </div>
    <img class="crop" id="crop" src="${cropUrl(r)}" alt="Scan crop">
    <div class="turnbar">
      <button id="zoomOut" title="Show more of the page around it"><kbd>-</kbd>Zoom out</button>
      <button id="zoomIn" title="Back towards the region" ${out ? "" : "disabled"}><kbd>+</kbd>Zoom in</button>
      <button id="marks" title="Show or hide the highlights on the scan"><kbd>h</kbd>Highlight ${marks ? "on" : "off"}</button>
      ${r.box ? `<span>·</span>
      <button id="turnLeft" title="Turn a quarter anticlockwise">↺</button>
      <button id="turnRight" title="Turn a quarter clockwise"><kbd>r</kbd>↻</button>
      <span>turned ${r.turn || 0}°</span>
      <button id="reread" title="Read the area again as it is turned now"><kbd>o</kbd>Read again</button>` : ""}
    </div>
    <div class="why">Flagged: ${r.reasons.map(x => `<span>${esc(x)}</span>`).join("")}</div>
    <div class="question">What is this?</div>
    <div class="options">${kindRows}</div>
    ${draft.kind === "initial" ? `<div class="question">The letter it shows</div>
      <input id="letter" class="letter" size="2" maxlength="3" value="${esc(draft.letter)}">`
    : WITH_TEXT.has(draft.kind) ? textBlock(r, doubt) : ""}
    <div class="saverow">
      <button id="save" class="primary" ${canSave(r, doubt) ? "" : "disabled"}>Save <kbd>↵</kbd></button>
      <span class="hint">${saveHint(r, doubt)}</span>
    </div>
    ${a ? `<div class="answer">Your answer: ${esc(state.actions[a.action])}${a.action === "initial" ? ` “${esc(a.text || "")}”` : a.text != null ? " · with your wording" : ""}. Save again to change it.</div>` : ""}
    <div class="nav">
      <span>${pos > 0 ? "<kbd>←</kbd>previous" : "first region"}</span>
      <span>${pos < queue.length - 1 ? "<kbd>→</kbd>next" : "last region"}</span>
    </div>
  </div>`;
  main.querySelectorAll("input[name=kind]").forEach(b => b.onchange = () => setKind(b.value));
  main.querySelectorAll("input[name=reading]").forEach(b => b.onchange = () => setReading(+b.value));
  document.getElementById("save").onclick = save;
  document.getElementById("zoomOut").onclick = () => zoom(1);
  document.getElementById("zoomIn").onclick = () => zoom(-1);
  document.getElementById("marks").onclick = toggleMarks;
  if (r.box) {
    document.getElementById("turnLeft").onclick = () => turn(-90);
    document.getElementById("turnRight").onclick = () => turn(90);
    document.getElementById("reread").onclick = reread;
  }
  const box = textBox();
  if (box) box.oninput = () => { draft.text = box.value; draft.confirm = false; refreshSave(); };
  main.querySelectorAll(".pad button").forEach(b => {
    b.onmousedown = e => e.preventDefault();  // keep the cursor in the text box
    b.onclick = () => insertChar(PAD[+b.dataset.k][0]);
  });
  const letter = document.getElementById("letter");
  if (letter) {
    letter.oninput = () => { draft.letter = letter.value; refreshSave(); };
    if (!letter.value) {
      fetch(`/api/initial?key=${encodeURIComponent(r.key)}`).then(x => x.json())
        .then(g => { if (!letter.value) { letter.value = draft.letter = g.letter; refreshSave(); } });
    }
  }
}

// The text part: for a doubt, the readings to choose from; otherwise the text box.
function textBlock(r, doubt) {
  const before = r.before ? `<div class="context">${esc(r.before)}</div>` : "";
  const after = r.after ? `<div class="context">${esc(r.after)}</div>` : "";
  if (!doubt) {
    const prompt = r.text ? "As printed (edit if the scan says otherwise):"
      : r.draft ? "Tesseract's draft of the highlighted area; correct it:" : "Type the text, as printed:";
    return `<div class="question">${prompt}</div>${before}
      <textarea id="text" rows="${Math.min(16, draft.text.split("\n").length + 1)}">${esc(draft.text)}</textarea>${charPad()}${after}`;
  }
  const base = central(r.readings.map(g => g.text));
  const rows = r.readings.map((g, k) => {
    const who = [k === 0 ? "text layer" : "", ...g.votes].filter(Boolean).join(" · ");
    const text = k === base ? esc(g.text) : marked(g.text, r.readings[base].text);
    return `<label class="option reading-option ${draft.reading === k ? "on" : ""} ${k === base ? "base" : ""}"><input type="radio" name="reading" value="${k}" ${draft.reading === k ? "checked" : ""}>
      <kbd>${READING_KEYS[k] || ""}</kbd><span class="reading">${text}</span>
      <span class="votes">${esc(who)}</span></label>`;
  }).join("");
  return `<div class="question">Which reading matches the scan?</div>
    <div class="legend">Marked where a reading differs from reading ${READING_KEYS[base]}, the one the others are closest to:
      <span><mark class="has">x</mark> only this one has it</span>
      <span><mark class="lacks">x</mark> this one lacks it</span>
      <span><mark class="swap">x</mark> this one has something else</span>
      <span><mark class="has"><span class="space">␣</span></mark> a space</span></div>${before}
    <div class="options">${rows}
      <label class="option reading-option ${draft.reading === -1 ? "on" : ""}"><input type="radio" name="reading" value="-1" ${draft.reading === -1 ? "checked" : ""}>
        <kbd>e</kbd><span class="reading muted">Something else…</span></label>
    </div>
    ${draft.reading === -1 ? `<textarea id="text" rows="2">${esc(draft.text)}</textarea>${charPad()}` : ""}${after}`;
}

// Characters a keyboard lacks, inserted into the text box at the cursor.
const PAD = [["—", "em dash (⌥⇧-)"], ["–", "en dash (⌥-)"], ["‘", "opening single quote (⌥])"],
  ["’", "closing single quote, apostrophe (⌥⇧])"], ["“", "opening double quote (⌥[)"],
  ["”", "closing double quote (⌥⇧[)"], ["…", "ellipsis (⌥;)"], ["\u2009", "thin space"]];
const charPad = () => `<div class="pad">${PAD.map(([c, name], k) =>
  `<button type="button" data-k="${k}" title="${esc(name)}">${c === "\u2009" ? "thin␣" : c}</button>`).join("")}</div>`;

function insertChar(c) {
  const box = textBox();
  if (!box) return;
  const at = box.selectionStart, end = box.selectionEnd;
  box.value = box.value.slice(0, at) + c + box.value.slice(end);
  box.selectionStart = box.selectionEnd = at + c.length;
  draft.text = box.value;
  refreshSave();
}

function canSave(r, doubt) {
  if (draft.kind === "initial") return draft.letter.trim() !== "";
  if (WITH_TEXT.has(draft.kind) && doubt) return draft.reading !== null;
  return true;
}

function saveHint(r, doubt) {
  if (draft.kind === "initial" && !draft.letter.trim()) return "Type the letter first.";
  if (WITH_TEXT.has(draft.kind) && doubt && draft.reading === null) return "Choose the reading that matches the scan.";
  return "Numbers choose what it is, letters the reading; Enter saves.";
}

function refreshSave() {
  const r = queue[pos], doubt = r.readings && r.readings.length > 1;
  document.getElementById("save").disabled = !canSave(r, doubt);
  const hint = document.querySelector(".saverow .hint");
  hint.textContent = saveHint(r, doubt);
  hint.classList.remove("warn");
}

function setKind(kind) {
  draft.kind = kind;
  render();
  if (kind === "initial") document.getElementById("letter")?.focus();
}

function setReading(k) {
  draft.reading = k;
  draft.confirm = false;
  render();
  if (k === -1) textBox()?.focus();
}

// Keys for the readings; e (something else), o (read again) and r (turn) are taken.
const READING_KEYS = "abcdfghj";

// The longest common subsequence table of two strings, filled from the ends.
function lcs(a, b) {
  const t = Array.from({length: a.length + 1}, () => new Uint16Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  return t;
}

// The reading the others differ from least: every other reading is marked against it.
function central(texts) {
  const cost = texts.map(a => texts.reduce((sum, b) => sum + a.length + b.length - 2 * lcs(a, b)[0][0], 0));
  return cost.indexOf(Math.min(...cost));
}

// `text` with every place it differs from `base` marked: what only it has, what it
// lacks (shown struck through), or what it has instead. Spaces in a mark show as ␣.
function marked(text, base) {
  const t = lcs(text, base);
  const ops = [];  // [kind, mine, theirs], adjacent edits merged
  const push = (kind, mine, theirs) => {
    const last = ops[ops.length - 1];
    if (last && (last[0] !== "same") === (kind !== "same")) {
      last[1] += mine; last[2] += theirs;
      if (kind !== "same") last[0] = "edit";
    } else ops.push([kind, mine, theirs]);
  };
  let i = 0, j = 0;
  while (i < text.length || j < base.length) {
    if (i < text.length && j < base.length && text[i] === base[j]) push("same", text[i++], base[j++]);
    else if (j < base.length && (i === text.length || t[i][j + 1] >= t[i + 1][j])) push("edit", "", base[j++]);
    else push("edit", text[i++], "");
  }
  // A lone space the two share between edits is part of one change.
  for (let k = ops.length - 2; k > 0; k--) {
    if (ops[k][0] === "same" && ops[k][1] === " ") {
      const [, m0, t0] = ops[k - 1], [, m1, t1] = ops[k + 1];
      ops.splice(k - 1, 3, ["edit", m0 + ops[k][1] + m1, t0 + ops[k][2] + t1]);
      k--;
    }
  }
  const DASHES = {"—": "em", "–": "en", "-": "hyphen", "‑": "hyphen"};
  const show = s => esc(s).replace(/ /g, '<span class="space">␣</span>')
    .replace(/[—–‑-]/g, d => `${d}<sub class="dash">${DASHES[d]}</sub>`);
  return ops.map(([kind, mine, theirs]) => kind === "same" ? esc(mine)
    : !mine ? `<mark class="lacks" title="this reading lacks it">${show(theirs)}</mark>`
    : !theirs ? `<mark class="has" title="only this reading has it">${show(mine)}</mark>`
    : `<mark class="swap" title="the plain reading has “${esc(theirs)}” here">${show(mine)}</mark>`).join("");
}

function cropUrl(r) {
  const m = `&mark=${marks ? 1 : 0}`;
  // A doubt's box is a place in its line: the line is tinted, the place underlined.
  const line = r.span ? `&line=${r.first}` : "";
  return r.box ? `/crop?page=${r.page}&box=${r.box.join(",")}&turn=${r.turn || 0}&out=${out}${line}${m}`
    : `/crop?page=${r.page}&first=${r.first}&last=${r.last}&out=${out}${m}`;
}

function toggleMarks() {
  marks = !marks;
  try { localStorage.setItem("marks", marks ? "on" : "off"); } catch (e) {}
  render();
}

// Zoom-out steps; 4 shows about a whole page. Moving to another region resets it.
const MAX_OUT = 4;
function zoom(by) {
  const next = Math.max(0, Math.min(MAX_OUT, out + by));
  if (next === out) return;
  out = next;
  render();
}

function turn(by) {
  const r = queue[pos];
  if (!r.box) return;
  r.turn = ((r.turn || 0) + by + 360) % 360;
  render();
}

async function reread() {
  const r = queue[pos];
  if (!r.box) return;
  const b = document.getElementById("reread");
  b.disabled = true; b.textContent = "Reading…";
  try {
    const resp = await fetch(`/api/read?key=${encodeURIComponent(r.key)}&turn=${r.turn || 0}`);
    if (!resp.ok) throw new Error(await resp.text());
    const text = (await resp.json()).text;
    r.draft = text;
    if (queue[pos] === r) { draft.text = text; render(); }
  } catch (e) { alert(e); }
}

async function save() {
  const r = queue[pos], doubt = r.readings && r.readings.length > 1;
  if (!canSave(r, doubt)) return;
  let text = r.text;
  if (draft.kind === "initial") text = draft.letter;
  else if (WITH_TEXT.has(draft.kind)) {
    text = doubt && draft.reading >= 0 ? r.readings[draft.reading].text : draft.text;
  }
  const body = {key: r.key, action: draft.kind, text, turn: r.turn || 0, confirm: !!draft.confirm};
  const resp = await fetch("/api/verdict", {method: "POST", body: JSON.stringify(body)});
  if (!resp.ok) { alert(await resp.text()); return; }
  const result = await resp.json();
  if (result.warning) {
    // A likely slip: say so once; Save again keeps the answer as it is.
    draft.confirm = true;
    const hint = document.querySelector(".saverow .hint");
    hint.textContent = `${result.warning} Save again to keep it.`;
    hint.classList.add("warn");
    return;
  }
  r.answer = result;
  draft = null;
  pos = nextUnanswered(pos);
  out = 0;
  render();
}

function go(to) {
  pos = Math.max(0, Math.min(queue.length - 1, to));
  out = 0;
  render();
}

document.getElementById("rebuild").onclick = async () => {
  const b = document.getElementById("rebuild");
  b.disabled = true; b.textContent = "Rebuilding…";
  try {
    const resp = await fetch("/api/rebuild", {method: "POST"});
    if (!resp.ok) throw new Error(await resp.text());
    state = await resp.json();
    rebuild();
  } catch (e) { alert(e); }
  b.disabled = false; b.textContent = "Rebuild book";
};

document.addEventListener("keydown", e => {
  const typing = e.target.tagName === "TEXTAREA" || e.target.id === "letter";
  if (typing) {
    if (e.key === "Escape") e.target.blur();
    else if (e.key === "Enter" && (e.target.id === "letter" || e.metaKey || e.ctrlKey)) {
      e.preventDefault(); save();
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const r = queue[pos], doubt = r && r.readings && r.readings.length > 1;
  if (KINDS[e.key] && (KINDS[e.key] !== "initial" || picture(r))) setKind(KINDS[e.key]);
  else if (e.key === "Enter") { e.preventDefault(); save(); }
  else if (e.key === "e" && doubt && WITH_TEXT.has(draft.kind)) { e.preventDefault(); setReading(-1); }
  else if (e.key === "e" && textBox()) { e.preventDefault(); textBox().focus(); }
  else if (doubt && WITH_TEXT.has(draft.kind) && e.key.length === 1 && READING_KEYS.includes(e.key)
    && READING_KEYS.indexOf(e.key) < r.readings.length) setReading(READING_KEYS.indexOf(e.key));
  else if (e.key === "r") turn(90);
  else if (e.key === "o") reread();
  else if (e.key === "h") toggleMarks();
  else if (e.key === "-") zoom(1);
  else if (e.key === "+" || e.key === "=") zoom(-1);
  else if (e.key === "ArrowRight") go(pos + 1);
  else if (e.key === "ArrowLeft") go(pos - 1);
});
load();
</script>

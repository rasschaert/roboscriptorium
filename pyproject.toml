[project]
name = "roboscriptorium"
version = "0.1.0"
description = "Turn books that aren't EPUBs (scanned PDFs first) into clean EPUBs, using local AI."
readme = "README.md"
authors = [
    { name = "Kenny Rasschaert", email = "kenny@kennyrasschaert.be" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "typer>=0.27.2",
]

[project.scripts]
roboscriptorium = "roboscriptorium:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
layout = [
    "doclayout-yolo>=0.0.4",
    "huggingface-hub>=2.1.1",
]

[tool.uv]
default-groups = ["dev", "layout"]

[tool.ruff]
line-length = 100
# Throwaway model probes.
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The first Scribner hardcover edition, first printing (November 2011, ISBN
# 978-1-4516-2728-2, printer's key 1 3 5 7 9 10 8 6 4 2, designed by Erich
# Hobbing): a serif body, chapter labels in a condensed bold
# sans, numbered sections as small centred numerals, running heads with the
# folio ("STEPHEN KING" / "11/22/63"), double quotes, unspaced em dashes, spaced
# ellipses. IA Scribe scan (version 4.3, Stella's vintage), 360 ppi MRC,
# GlyphLessFont layer, 374×644 pt, a library copy (Richmond). Pages 15–865: the
# half title and prologue to the end of the Afterword. The layer reads the
# capital I as T, |, 1, \ or J and merges "in a" to "ina". Internet Archive
# lends it only, so it is placed by hand.
[[scans]]
id = "ia-scan"
source = "https://archive.org/details/112263novel0000king_a7f3 (borrow, then download the PDF)"
sha256 = "f63510d34c0fdefec3995ee99d91b44c6caf687531aaa4ad7979ae0927c38e5d"
cover_page = 1
body_pages = [15, 865]

# (Heerenveen) with labels on the front pages. Pages 9–482: the Woord vooraf
# to the end of the Epiloog. The layer lacks the chapter numerals 1–9, reads
# ë as é and small capitals as lower case. Internet Archive lends it only, so
# it is placed by hand.

# De Bezige Bij's e-book of 2017 (ISBN 978 90 234 8927 6): the same text as Karakter's
# e-book of the scan's edition, line for line from the first chapter on, in cleaner
# markup. Chapter numbers "hoofdstuk"; italics "times-italic"; small capitals "times-sc"
# (in lower case), set in capitals as printed. The series recap before chapter 1 (print
# pp. 7–12) has no heading, so it is left out with its pages.
[reference]

# De Fontein's own e-book (InDesign export, ISBN 978 90 261 6142 1, "Dit e-book is
# gebaseerd op de eerste druk, mei 2022"), found by the user (2026-10-17). One file a
# chapter: its number a "_1-Hoofdstukcijfer" paragraph above its name, a
# "_2-Hoofdstuktitel" paragraph ("Alex", "Renee"), each read as a heading of its own;
# "Proloog" and "Epiloog" are "_2-Hoofdstuktitel-copy--toc-entry-". The print sets the
# names in capitals, the EPUB in lower case with `text-transform: uppercase`, so their
# classes are capital classes. The map (Section-0005, an image) and the front and back
# matter (author's note, acknowledgements, adverts) are left out.
[reference]

# Van Gennep's own EPUB ("e-editie maart 2014, naar de eerste druk maart 2014").
# Chapter titles are "kop" paragraphs; italics the "italic" class. Footnotes
# ("noten", after a "bodybefore" rule) go to notes.txt: the pipeline doesn't
# place footnotes yet, so scoring leaves the scan's footnote lines out.
[reference]
source = "Reis om mijn schedel, Van Gennep 2014, transl. Frans van Nes (EPUB)"
sha256 = "18b21c8f85705ac829f21b5ee074716c95ea3b6f5de8d0a9026057cf398be434"
files = [

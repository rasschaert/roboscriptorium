# Flatiron's e-book (ISBN 978 1 250 10890 6, the e-book of the first edition).
# Each part a file with two <h1>: its number ("Part I") and its title, over a map;
# each chapter a file, its number an <h1>, then a motto of a few paragraphs
# ("Chap-Epigraph-non-verse-cepi", read as text) with its source. The footnotes
# (145) sit in one file at the end, numbered from 1 in each chapter as the print
# numbers them; each opens on its number ("1. A kind of cold war"). The editor's
# note and the six appendices are read; acknowledgments and ads are left out.
[reference]
source = "FKA USA, Flatiron Books 2019, e-book ISBN 978 1 250 10890 6 (EPUB)"

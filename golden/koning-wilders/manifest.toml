title = "Koning Wilders"
author = "H.M. van den Brink"
language = "nl"
# Van den Brink is alive: under copyright, so only this manifest is in git.
eu_copyright_until = 2200

# Atlas Contact's EPUB (e-book Suzan Beijer, "made from the first printing, 2017,
# ISBN 978 90 450 3486 7"; exported from InDesign, Kobo spans; its fonts obfuscated,
# not its text). The essay is one file without headings, its sections opening on a
# drawn initial set as an image with no alt text ("letter_D.jpg"): the letter is read
# from the file name. Italics are the "Cursief" class; "Kleinkap" text is already in
# capitals. The reading list, the author's note and the front matter are left out.
[reference]
source = "Koning Wilders, Atlas Contact 2017, e-book ISBN 978 90 450 3487 4 (EPUB)"
sha256 = "728c5c25ac2170dce87ccd17d2ad4348a342533aca828f107d69794b9f2cecc5"
files = ["Text/Koning_Wilders-3.xhtml"]
italic_classes = ["Cursief"]
blank_classes = ["pagebreak", "Kop1"]  # Kop1: a hidden title the print lacks on p. 7
initial_images = "letter_(\\w)\\d*\\."
one_chapter = true

# The first printing (ISBN 978 90 450 3486 7; typography Suzan Beijer, printed by
# Bariet Ten Brink). Internet Archive lends it only, so it is placed by hand
# (sourced by the user, 2026-10-11). Pages 7–96: the essay; p. 97 its reading list.
[[scans]]
id = "ia-scan"
source = "https://archive.org/details/koningwilderseen0000brin_z3f7 (borrow, then download the PDF)"
sha256 = "dfe92242399e1956b2f43a69bc2e4ab262bcf3e65e84b946a9b291de72dc7890"
cover_page = 1
body_pages = [7, 96]

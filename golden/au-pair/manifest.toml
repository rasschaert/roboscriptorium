# The 19th printing (De Bezige Bij, Ulysses, August 2006, ISBN 90 234 2042 X); IA Scribe
# scan (4.4), 360 ppi MRC, GlyphLessFont layer, ~318×544 pt, 452 pages. Pages 7–447 the
# 96 chapters, p. 449 the Aantekening. Single quotes, which the layer often reads as
# doubles; an opening quote before an apostrophe ("‘’t Is", scan p. 107), as in the
# e-book. Internet Archive lends it only, so it is placed by hand (sourced by the user,
# 2026-10-18).

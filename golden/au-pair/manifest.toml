title = "Au pair"
author = "Willem Frederik Hermans"
language = "nl"
# Hermans died in 1995: under copyright until 2065, so only this manifest is in git.
eu_copyright_until = 2065

# De Bezige Bij's own e-book ("Deze digitale editie is gemaakt naar de 21e druk, 2010",
# e-book by Peter Verwey), as a Kobo file run through calibre: koboSpan spans and
# calibre classes around the publisher's wp-/wpt- classes, its five fonts
# Adobe-obfuscated (the text is not). Chapters are "wp-kop" paragraphs (1–96), then
# the author's "Aantekening" ("wp-bovenkop"), which the print sets too (scan p. 449);
# the blurb, title pages and colophon before chapter 1 are left out. Six stray closing
# quotes sit in "wpt-wit" spans set in white, which the print doesn't have (scan pp.
# 69, 134, 203, 263, 327, 386). The small capitals of abbreviations and inscriptions
# ("fnac", "edf", "abstvlit qvi dedit", ~30 words) are written in lower case with no
# class left to mark them: verdicts settle them. "wp-witregel" paragraphs are blank
# lines, most of them scene breaks.
[reference]
source = "Au pair, De Bezige Bij e-book (after the 21st printing, 2010), ISBN 978 90 234 6706 9 (EPUB)"
sha256 = "b8a9cca1bbe58fc5064b39056965a5046f6f3f2295c6088867bcc953362e2f80"

title = "Steve Jobs"
author = "Walter Isaacson"
language = "nl"
# Isaacson and his translator are alive: under copyright, so only this manifest is in
# git.
eu_copyright_until = 2200

# The retail EPUB of Rob de Ridder's translation (Spectrum 2011, typeset by Elgraphic,
# "gemaakt naar de eerste druk"); calibre only re-split its files. "HOOFDSTUK n" labels
# are "el2" paragraphs above an h1 title; captions are "el-bijschrift"; "el-witregel"
# paragraphs ("==") are spacing around letters and block quotes, not scene breaks.
# The photo insert ("Fotokatern") follows chapter 20 here but is bound in chapter 23 of
# the print (scan pp. 387–402).
[reference]
source = "Steve Jobs. De biografie, Spectrum 2011, translated by Rob de Ridder, ISBN 9789000302734 (retail EPUB of the first printing)"

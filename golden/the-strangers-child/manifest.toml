title = "The Stranger's Child"
author = "Alan Hollinghurst"
language = "en"
# Hollinghurst is alive: under copyright, so only this manifest is in git.
eu_copyright_until = 2200

# Picador's e-book ("This electronic edition published 2011 by Picador", ISBN
# 978 1 4472 0398 8), passed through calibre 3.19 (Kindle classes). Part labels
# ("ONE") and part titles are files of their own, chapter numbers <h4>; a part's
# motto sits in its own file. No scene breaks: the only blank lines ("calibre_17")
# close a quoted block. Verse quotations are "calibre_14" paragraphs, and
# the prose after one goes on unindented ("calibre_12"); Part Four holds an
# interview transcript ("PB:", "JT:").
[reference]
source = "The Stranger's Child, Picador 2011, ISBN 9781447203988 (EPUB, via calibre)"
sha256 = "7ffd726134311e1748eef6eb12f9267e06b85f28014b66be8b432bbfbca6d755"
files = [
  "index_split_003.html", "index_split_004.html", "index_split_005.html", "index_split_006.html", "index_split_007.html", "index_split_008.html", "index_split_009.html", "index_split_010.html", "index_split_011.html", "index_split_012.html", "index_split_013.html", "index_split_014.html", "index_split_015.html", "index_split_016.html", "index_split_017.html", "index_split_018.html", "index_split_019.html", "index_split_020.html", "index_split_021.html", "index_split_022.html", "index_split_023.html", "index_split_024.html", "index_split_025.html", "index_split_026.html", "index_split_027.html", "index_split_028.html", "index_split_029.html", "index_split_030.html", "index_split_031.html", "index_split_032.html", "index_split_033.html", "index_split_034.html", "index_split_035.html", "index_split_036.html", "index_split_037.html", "index_split_038.html", "index_split_039.html", "index_split_040.html", "index_split_041.html", "index_split_042.html", "index_split_043.html", "index_split_044.html", "index_split_045.html", "index_split_046.html", "index_split_047.html", "index_split_048.html", "index_split_049.html", "index_split_050.html", "index_split_051.html", "index_split_052.html", "index_split_053.html", "index_split_054.html"
]
heading_prefixes = ["calibre_4"]  # the part labels ("ONE"), paragraphs of their own

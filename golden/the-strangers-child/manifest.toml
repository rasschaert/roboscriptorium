# The Picador paperback, "This edition published 2012" (ISBN 978 0 330 48327 8,
# printer's key 1 3 5 7 9 8 6 4 2, typeset by SetSystems); IA Scribe scan
# (2021), 360 ppi MRC, GlyphLessFont layer, ~327×538 pt. Single quotes,
# spaced en dashes, spaced ". . ." ellipses; running heads with the title and
# the part. Pages 15–578: part one's label to the end of the novel; the praise,
# dedication, author's note and the author's biography are left out. Internet
# Archive lends it only, so it is placed by hand.
[[scans]]
id = "ia-scan"
source = "https://archive.org/details/strangerschild0000holl_o3m5 (borrow, then download the PDF)"
sha256 = "f10b4665f16e1d4427e703bfa3dc0327e6febe7791537420b5fbb0b8f66e8c6d"
cover_page = 1
body_pages = [15, 578]

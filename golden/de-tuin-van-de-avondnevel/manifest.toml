# The paperback, "Eerste druk 2014" (ISBN 9789401602457): the same translation
# and typesetter as the reference, a later edition, so differences may be
# corrections and need verdicts before they count as errors. Held out: scored
# to check that changes carry over, never tuned on. Internet Archive lends it
# only, so it is placed by hand. Pages 11–374: chapters 1–26; the author's
# notes are left out.

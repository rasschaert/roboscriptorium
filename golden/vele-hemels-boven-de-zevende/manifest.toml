title = "Vele hemels boven de zevende"
author = "Griet Op de Beeck"
language = "nl"
# Op de Beeck is living: under copyright, so only this manifest is in git.
eu_copyright_until = 2200

# Prometheus' e-book (2013, ISBN 90 446 2325 7, no DRM), passed once through calibre (its
# class names), its text matching the scan at the layer's slip rate (0.36% CER, OCR slips
# only: "ij" read "y", "hè" read "hé", "Tk" for "Ik"; experiments/probe_candidate.py,
# 2026-11-24). Flemish author, her debut. The spine's sections 5–74: eleven parts, each
# its number over its title on a page of its own ("1" then "SOMMIGE MENSEN VERGETEN
# NIKS", joined as one heading, `heading_lines`), and chapters headed by the narrator's
# name in small capitals ("EVA", "LOU", "CASPER", "ELSIE", "JOS", written as capitals);
# the title page, the dedication and colophon and the mottos are left out. Small capitals
# in the text ("BMX", "IQ") are written as capitals too.

# HarperCollins Holland's own e-book (ISBN 978 94 027 6862 6) of the first printing,
# June 2023, typeset by Mat-Zet like Goede dochter. Found by the user (2026-10-17). A
# sibling of Goede dochter (author, publisher, typesetter) and Het heft in eigen hand
# (publisher, typesetter), both tuning: it can only ever join tuning. Chapter numbers
# are "P_Cijfer" paragraphs, part and section titles "P_Kop…" ("PROLOOG", "DRIE JAAR
# LATER"). It opens with a text message before the prologue (`leading_text`). The
# e-book sets an em dash where the print sets a spaced en dash ("– hoe zal ik het
# noemen? –", p. 84). Its buy-link file carries a buyer watermark with an
# identification code: it is not read, and the EPUB never leaves work/. The
# acknowledgements and colophon are left out.
[reference]
source = "Na die nacht, HarperCollins Holland 2023 (first printing), e-book ISBN 978 94 027 6862 6 (EPUB)"
sha256 = "0ab530af4077d8863a3ec75930892a09ea59530327791200c44c229ce0eedac1"
files = [

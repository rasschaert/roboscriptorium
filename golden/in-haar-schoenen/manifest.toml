# Meulenhoff Boekerij's own e-book (2016, ISBN 978 94 6092 464 4, no DRM; "Deze titel
# verscheen eerder bij Uitgeverij Prometheus", "© Nederlandse vertaling 2003/2016"): the
# 2003 translation reset by ZetSpiegel, its text matching the scan at the layer's own slip
# rate (0.15–0.32% CER a band of pages, experiments/probe_candidate.py, 2026-11-24). The
# spine's files 3–66 (chapter 1 in "Section0003"): three parts ("I In haar schoenen", "II Verder studeren", "III Ik
# draag je hart met me mee"), chapters 1–60 as h1 numerals, "Woord van dank" and
# "Verantwoording van de gedichten"; the blurb, the title page, the colophon and the
# excerpt from another novel at the end are left out. Italics are "Times-Italic" spans.
# Each chapter's first line is set in small capitals ("Times-SC", 0.667em), written as
# capitals, so nothing undoes them. Single quotes, as the print sets them.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="388" fill="#ffffff"/>
  <text x="30" y="32" font-size="15" font-weight="bold" fill="#3b4252">A printed page in, a reflowing e-book out</text>

  <!-- the printed page -->
  <rect x="30" y="50" width="330" height="270" rx="4" fill="#f4efe2" stroke="#b8ab8a"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2b2b">
    <text x="195" y="76" font-size="10" letter-spacing="2" text-anchor="middle">DE ZOMER</text>
    <g font-size="13">
      <text x="48" y="108">Ze liep de tuin in en bleef bij het hek</text>
      <text x="48" y="128">staan. Achter haar sloeg de deur dicht,</text>
      <text x="48" y="148">en ze wist dat ze niet terug kon. De <tspan fill="#c2671b" font-weight="bold">ge-</tspan></text>
      <text x="48" y="168"><tspan fill="#c2671b" font-weight="bold">dachte</tspan> maakte haar rustig.</text>
      <text x="62" y="188">‘Kom je?’ riep hij vanaf de weg.</text>
      <text x="62" y="208">Ze knikte, al kon hij het niet zien. Het</text>
      <text x="48" y="228"><tspan fill="#c2671b" font-weight="bold">zwart-wit</tspan> van de koeien in de wei, het</text>
      <text x="48" y="248">licht dat over het water lag: ze zou het</text>
      <text x="48" y="268">missen.</text>
    </g>
    <text x="195" y="304" font-size="11" text-anchor="middle">37</text>
  </g>
  <!-- what goes -->
  <g stroke="#b3261e" stroke-width="2">
    <line x1="150" y1="72" x2="240" y2="72"/>
    <line x1="186" y1="300" x2="204" y2="300"/>
  </g>

  <!-- arrow -->
  <path d="M 380 185 L 448 185" stroke="#3b4252" stroke-width="2" fill="none"/>
  <path d="M 448 179 L 458 185 L 448 191 Z" fill="#3b4252"/>

  <!-- the phone -->
  <rect x="478" y="46" width="230" height="280" rx="26" fill="#3b4252"/>
  <rect x="490" y="70" width="206" height="232" rx="6" fill="#ffffff"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#2b2b2b">
    <text x="500" y="92">Ze liep de tuin in en bleef bij het</text>
    <text x="500" y="108">hek staan. Achter haar sloeg de</text>
    <text x="500" y="124">deur dicht, en ze wist dat ze niet</text>
    <text x="500" y="140">terug kon. De <tspan fill="#2e7d32" font-weight="bold">gedachte</tspan> maakte</text>
    <text x="500" y="156">haar rustig.</text>
    <text x="512" y="176">‘Kom je?’ riep hij vanaf de weg.</text>
    <text x="512" y="196">Ze knikte, al kon hij het niet</text>
    <text x="500" y="212">zien. Het <tspan fill="#2e7d32" font-weight="bold">zwart-wit</tspan> van de koeien</text>
    <text x="500" y="228">in de wei, het licht dat over het</text>
    <text x="500" y="244">water lag: ze zou het missen.</text>
  </g>

  <!-- the key -->
  <g font-size="12" fill="#3b4252">
    <line x1="30" y1="346" x2="50" y2="346" stroke="#b3261e" stroke-width="2"/>
    <text x="58" y="350">dropped: the running head and the page number</text>
    <text x="30" y="368"><tspan fill="#c2671b" font-weight="bold">orange</tspan>: a hyphen at a line’s end is dropped (gedachte); a word’s own hyphen is kept (zwart-wit)</text>
  </g>
  <text x="30" y="384" font-size="11" fill="#7b8aa6">Kept as printed: the words, the paragraphs and their indents, the curly quotes. An invented page.</text>
</svg>

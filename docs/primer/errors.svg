  <text x="30" y="448" font-size="12" fill="#3b4252">In all: 17 places asked and <tspan font-weight="bold">15 unasked</tspan> a hundred pages, over 1,912 pages (tuning 2026-10-17, validation 2026-10-17).</text>
  <text x="30" y="468" font-size="11" fill="#7b8aa6">Before review; the causes are read from each error’s two sides (errorlog.cause); a place may be several words.</text>

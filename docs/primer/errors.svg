  <text x="30" y="448" font-size="12" fill="#3b4252">In all: 19 places asked and <tspan font-weight="bold">15 unasked</tspan> a hundred pages, over 5,444 pages (tuning 2026-11-05, validation 2026-11-05).</text>
  <text x="30" y="468" font-size="11" fill="#7b8aa6">Before review; the causes are read from each error’s two sides (errorlog.cause); a place may be several words.</text>
  <text x="30" y="484" font-size="11" fill="#7b8aa6">Generated by experiments/primer_errors.py from the latest benches.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>

  <text x="30" y="32" font-size="15" font-weight="bold" fill="#3b4252">Render and compare: which drawing covers the scan's ink?</text>
  <text x="30" y="56" font-size="13" fill="#4c566a">Each version is drawn in the book's own typeface, at its size, and laid over the ink at that place.</text>

  <!-- the two panels: the scan's ink at the suspect -->
  <rect x="30" y="76" width="340" height="230" rx="4" fill="#f4efe2" stroke="#b8ab8a"/>
  <rect x="390" y="76" width="340" height="230" rx="4" fill="#f4efe2" stroke="#b8ab8a"/>
  <text x="200" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b4252">drawing “scenes”</text>
  <text x="560" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b4252">drawing “scènes”</text>

  <!-- the print's ink, the same in both panels: “scènes” -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="52" text-anchor="middle" fill="#5b5b5b">
    <text x="138" y="200">s</text><text x="160.5" y="200">c</text><text x="184.5" y="200">e</text>
    <text x="212" y="200">n</text><text x="239.5" y="200">e</text><text x="263" y="200">s</text>
    <text x="498" y="200">s</text><text x="520.5" y="200">c</text><text x="544.5" y="200">e</text>
    <text x="572" y="200">n</text><text x="599.5" y="200">e</text><text x="623" y="200">s</text>
  </g>
  <path d="M 537.5 156 L 546.5 168" stroke="#5b5b5b" stroke-width="5" stroke-linecap="round"/>
  <!-- left panel: the accent's ink, which the drawing doesn't cover -->
  <path d="M 177.5 156 L 186.5 168" stroke="#b3261e" stroke-width="5" stroke-linecap="round"/>

  <!-- the drawings laid over the ink -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="52" text-anchor="middle" fill="#2f6fd6" fill-opacity="0.5">
    <text x="139.5" y="200">s</text><text x="162" y="200">c</text><text x="186" y="200">e</text>
    <text x="213.5" y="200">n</text><text x="241" y="200">e</text><text x="264.5" y="200">s</text>
    <text x="499.5" y="200">s</text><text x="522" y="200">c</text><text x="546" y="200">e</text>
    <text x="573.5" y="200">n</text><text x="601" y="200">e</text><text x="624.5" y="200">s</text>
  </g>
  <path d="M 539 156 L 548 168" stroke="#2f6fd6" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>

  <!-- annotation on the left panel -->
  <line x1="236" y1="140" x2="192" y2="158" stroke="#b3261e" stroke-width="1.5"/>
  <text x="240" y="138" font-size="12" fill="#b3261e">ink left bare</text>

  <!-- verdicts -->
  <text x="200" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3261e">worse fit</text>
  <text x="200" y="276" text-anchor="middle" font-size="12" fill="#4c566a">the accent's ink is left over</text>
  <text x="560" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">best fit: its vote</text>
  <text x="560" y="276" text-anchor="middle" font-size="12" fill="#4c566a">every bit of ink is covered</text>

  <!-- legend -->
  <g font-size="12" fill="#3b4252">
    <rect x="30" y="326" width="14" height="14" fill="#5b5b5b"/>
    <text x="50" y="337">the scan's ink</text>
    <rect x="160" y="326" width="14" height="14" fill="#2f6fd6" fill-opacity="0.5"/>
    <text x="180" y="337">the drawing</text>
    <rect x="280" y="326" width="14" height="14" fill="#b3261e"/>
    <text x="300" y="337">ink the drawing leaves bare</text>
  </g>
  <text x="30" y="376" font-size="12" fill="#4c566a">It never asks what the word ought to be, so a speck, small capitals or a stop against a comma is judged the same way.</text>
</svg>

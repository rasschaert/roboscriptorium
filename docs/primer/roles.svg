<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-size="15" font-weight="bold" fill="#3b4252">The same kind of page as the sorter sees it: a role for every line</text>

  <rect x="30" y="50" width="400" height="290" rx="4" fill="#f4efe2" stroke="#b8ab8a"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2b2b">
    <text x="230" y="76" font-size="10" letter-spacing="2" text-anchor="middle">DE ZOMER</text>
    <g font-size="13">
      <text x="48" y="106">Ze knikte, al kon hij het niet zien. Het licht</text>
      <text x="48" y="126">dat over het water lag: ze zou het missen.</text>
    </g>
    <text x="230" y="170" font-size="20" text-anchor="middle">4</text>
    <g font-size="13">
      <text x="48" y="206">De volgende ochtend stond de auto al <tspan fill="#c2671b" font-weight="bold">voor-</tspan></text>
      <text x="48" y="226"><tspan fill="#c2671b" font-weight="bold">gereden</tspan>. Niemand zei iets over de avond</text>
      <text x="48" y="246">ervoor; haar vader droeg de koffers naar</text>
      <text x="48" y="266">buiten en keek niet om.</text>
      <text x="62" y="286">‘Heb je alles?’</text>
    </g>
    <text x="230" y="322" font-size="11" text-anchor="middle">38</text>
  </g>

  <!-- role tags -->
  <g font-size="12">
    <rect x="452" y="62" width="186" height="20" rx="10" fill="#f6d9d7"/>
    <text x="462" y="76" fill="#b3261e">running head → dropped</text>
    <rect x="452" y="102" width="56" height="20" rx="10" fill="#dbe9f7"/>
    <text x="462" y="116" fill="#2e6db4">body</text>
    <rect x="452" y="156" width="214" height="20" rx="10" fill="#e3d7f2"/>
    <text x="462" y="170" fill="#5b3a8c">chapter heading → a new chapter</text>
    <rect x="452" y="226" width="56" height="20" rx="10" fill="#dbe9f7"/>
    <text x="462" y="240" fill="#2e6db4">body</text>
    <rect x="452" y="308" width="198" height="20" rx="10" fill="#f6d9d7"/>
    <text x="462" y="322" fill="#b3261e">page number → dropped</text>
  </g>
  <g stroke="#b8ab8a" stroke-width="1" stroke-dasharray="3 3">
    <line x1="290" y1="72" x2="448" y2="72"/>
    <line x1="420" y1="112" x2="448" y2="112"/>
    <line x1="250" y1="166" x2="448" y2="166"/>
    <line x1="420" y1="236" x2="448" y2="236"/>
    <line x1="250" y1="318" x2="448" y2="318"/>
  </g>

  <!-- paragraph and hyphen decisions -->
  <rect x="44" y="190" width="372" height="82" rx="4" fill="none" stroke="#2e6db4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="44" y="273" width="372" height="18" rx="4" fill="none" stroke="#2e6db4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="452" y="270" font-size="12" fill="#3b4252">dashed boxes: one paragraph each,</text>
  <text x="452" y="285" font-size="12" fill="#3b4252">found by the indent and the short last line</text>
  <text x="452" y="203" font-size="12" fill="#c2671b">voor- + gereden → voorgereden</text>
  <text x="452" y="218" font-size="12" fill="#c2671b">(the line’s hyphen, not the word’s)</text>
</svg>

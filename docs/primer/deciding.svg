</tspan></text></g><g class="YXNr human"><g class="shape" ><path d="M 1387 260 H 1233 V 259 C 1233 241 1250 226 1277 218 C 1262 211 1253 201 1253 191 C 1253 172 1279 157 1310 157 C 1341 157 1367 172 1367 191 C 1367 202 1358 212 1344 218 C 1371 226 1388 241 1388 259 V 260 H 1387 Z" stroke="#9b3d7f" fill="#f6e3f0" style="stroke-width:2;" /></g><text x="1310" y="279" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="1310" dy="0">unsure: ask you,</tspan><tspan x="1310" dy="16">with the scan beside it</tspan></text></g><g class="anVkZ2VzLmNsZWY= step"><g class="shape" ><rect x="355" y="41" width="230" height="79" rx="6" stroke="#3b4252" fill="#ffffff" style="stroke-width:2;" /></g><text x="470" y="78.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="470" dy="0">clef looks at the crop:</tspan><tspan x="470" dy="17">“vijf jaar”, 93% sure</tspan></text></g><g class="anVkZ2VzLndpbm5vdw== step"><g class="shape" ><rect x="355" y="132" width="230" height="79" rx="6" stroke="#3b4252" fill="#ffffff" style="stroke-width:2;" /></g><text x="470" y="169.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="470" dy="0">winnow reads the sentence:</tspan><tspan x="470" dy="17">“vijf jaar”, 71% sure</tspan></text></g><g class="anVkZ2VzLndvcmRz step"><g class="shape" ><rect x="355" y="223" width="230" height="79" rx="6" stroke="#3b4252" fill="#ffffff" style="stroke-width:2;" /></g><text x="470" y="260.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="470" dy="0">the word list:</tspan><tspan x="470" dy="17">“vijfjaar” isn’t a word</tspan></text></g><g class="KHN1c3BlY3QgLSZndDsganVkZ2VzKVswXQ=="><marker id="mk-d2-1232039587-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection f